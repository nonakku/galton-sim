<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正規分布シミュレーター</title>
    <link rel="stylesheet" href="style.css">
    <script src="matter.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside id="parameterPanel" class="sidebar" aria-label="パラメーター設定">
            <div class="sidebar-header">
                <p class="eyebrow">Galton Board</p>
                <h1>正規分布シミュレーター</h1>
            </div>

            <div class="param-section" id="methodSection">
                <h2><span>Method</span><small>生成条件</small></h2>
                <label>
                    <span>玉の生成数/秒</span>
                    <input id="ballRateInput" type="number" step="0.1" value="2">
                </label>
            </div>

            <div class="param-section" id="ballSection">
                <h2><span>Material</span><small>玉の性質</small></h2>
                <label>
                    <span>半径</span>
                    <input id="ballRadiusInput" type="number" value="10">
                </label>
                <label>
                    <span>密度</span>
                    <input id="densityInput" type="number" step="0.01" value="0.1">
                </label>
                <label>
                    <span>反発係数</span>
                    <input id="restitutionInput" type="number" step="0.1" value="0.5">
                </label>
                <label>
                    <span>摩擦</span>
                    <input id="frictionInput" type="number" step="0.01" value="0.01">
                </label>
            </div>

            <div class="param-section" id="pinSection">
                <h2><span>Machine</span><small>装置条件</small></h2>
                <label>
                    <span>半径</span>
                    <input id="pinRadiusInput" type="number" value="10">
                </label>
                <label>
                    <span>水平間隔</span>
                    <input id="colSpacingInput" type="number" value="80">
                </label>
                <label>
                    <span>垂直間隔</span>
                    <input id="rowSpacingInput" type="number" value="40">
                </label>
                <label>
                    <span>行数</span>
                    <input id="rowCountInput" type="number" value="9" readonly>
                </label>
            </div>

            <div class="param-section" id="manSection">
                <h2><span>Man</span><small>操作条件</small></h2>
                <label class="check-row">
                    <input id="enableRandomOffset" type="checkbox" checked>
                    <span>ランダムオフセットX</span>
                </label>
                <label class="check-row">
                    <input id="enableRandomVelocity" type="checkbox" checked>
                    <span>ランダム速度X</span>
                </label>
            </div>

            <div class="param-section" id="environmentSection">
                <h2><span>Environment</span><small>環境条件</small></h2>
                <label>
                    <span>空気抵抗</span>
                    <input id="frictionAirInput" type="number" step="0.01" value="0.01">
                </label>
                <label>
                    <span>重力</span>
                    <input id="gravityInput" type="number" step="0.1" value="1.0">
                </label>
            </div>

            <div class="settings-actions">
                <button id="restartSimulationButton" class="button button-primary" type="button">設定を反映してリセット</button>
                <button id="resetParamsButton" class="button button-secondary" type="button">初期値に戻す</button>
            </div>
        </aside>

        <main class="workspace">
            <section class="top-panel" aria-label="シミュレーション操作">
                <div class="run-card">
                    <button id="toggleButton" class="button button-start" type="button">開始</button>
                    <div class="run-copy">
                        <h2>シミュレーション操作</h2>
                        <p>準備完了</p>
                    </div>
                </div>

                <div class="metrics">
                    <div id="ballCounter" class="metric-card">生成した玉数 = 0 / 200 個</div>
                    <div id="deviationDisplay" class="metric-card metric-alert distribution-card">
                        <span class="metric-main">分布のズレ: --</span>
                        <span class="metric-sub">χ²: -- / p値: --</span>
                    </div>
                    <a class="stats-guide-link" href="stats-guide.html" target="_blank" rel="noopener">統計表示の見方</a>
                </div>
            </section>

            <section id="bucketCounts" class="bucket-panel" aria-label="各仕切りの玉数">各仕切りの玉数: </section>

            <section class="simulation-panel" aria-label="シミュレーション表示">
                <div class="simulation-board">
                    <div id="simulationContainer"></div>
                </div>
                <aside class="chart-panel" aria-label="棒グラフ表示">
                    <h2>分布グラフ</h2>
                    <canvas id="barChart" width="260" height="280"></canvas>
                </aside>
            </section>
        </main>
    </div>
</body>

</html>
